<!--
  Template do e-mail de LOGIN (Magic Link) — usado quando a conta já existe.
  Colar em: Supabase → Authentication → Emails → template "Magic Link"
  Variável usada: {{ .Token }}  (código enviado pelo Supabase — o tamanho é definido lá, não fixe no app)

  IMPORTANTE: este template mostra apenas o CÓDIGO, sem link clicável.
  Motivo: um link aberto pelo e-mail costuma abrir no navegador PADRÃO do
  celular, que pode não ser o mesmo em que a pessoa estava jogando. Como o
  progresso ainda não sincronizado vive no localStorage (que é separado por
  navegador), ela acabava logada num navegador diferente, com outro progresso,
  parecendo que o salvamento falhou. Com código, a pessoa continua na mesma
  aba e o progresso dela sobe corretamente.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0e0a; padding:32px 16px; font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px; background-color:#12171a; border:1px solid #22c55e33; border-radius:16px; overflow:hidden;">
        <tr>
          <td style="padding:32px 28px 8px; text-align:center;">
            <div style="font-size:11px; letter-spacing:3px; color:#22c55e; font-weight:bold; text-transform:uppercase; margin-bottom:6px;">GYM RPG</div>
            <div style="font-size:26px; font-weight:900; color:#ffffff; letter-spacing:1px;">FREAKY<span style="color:#22c55e;">QUEST</span></div>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 28px 8px; text-align:center;">
            <div style="font-size:40px; line-height:1;">🔑</div>
            <h1 style="font-size:18px; color:#ffffff; margin:14px 0 8px;">Seu código de acesso</h1>
            <p style="font-size:13px; color:#9ca3af; line-height:1.6; margin:0 0 20px;">
              Digite o código abaixo na tela do FreakyQuest onde você já está. Ele expira em alguns minutos.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 24px; text-align:center;">
            <div style="display:inline-block; background-color:#0a0e0a; border:1px solid #22c55e; border-radius:12px; padding:16px 28px; font-size:32px; font-weight:900; letter-spacing:10px; color:#22c55e; font-family:'Courier New',Courier,monospace;">
              {{ .Token }}
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 28px; text-align:center; border-top:1px solid #ffffff14; padding-top:20px;">
            <p style="font-size:11px; color:#6b7280; line-height:1.6; margin:0;">
              Não foi você? Pode ignorar esse e-mail com tranquilidade — sua conta continua segura.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
